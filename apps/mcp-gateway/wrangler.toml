name = "node2flow-mcp-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-13"

# D1 Database - Product data (connections for all products)
[[d1_databases]]
binding = "DB"
database_name = "node2flow-products-db"
database_id = "" # TODO: Create with `wrangler d1 create node2flow-products-db`
migrations_dir = "migrations"

# Service Binding to Platform Worker
[[services]]
binding = "PLATFORM"
service = "node2flow-platform"

# Environment variables (set via wrangler secret)
# JWT_SECRET, ENCRYPTION_KEY
