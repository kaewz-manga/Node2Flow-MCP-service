name = "node2flow-mcp-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-13"

routes = [
  { pattern = "mcp.node2flow.net", custom_domain = true }
]

# D1 Database - Product data (connections for all products)
[[d1_databases]]
binding = "DB"
database_name = "node2flow-products-db"
database_id = "d58d9176-0836-4e83-90d9-4450ca8b3bb9"
migrations_dir = "migrations"

# Service Binding to Platform Worker
[[services]]
binding = "PLATFORM"
service = "node2flow-platform"

# KV Namespace - OAuth state storage
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "a65a07688d774d56bb915cf9e961881a"

# VPS MCP server URLs
[vars]
CL_N8N_MCP_URL = "https://n8n-mcp-dynamic.node2flow.net"
NOTION_OFFICIAL_MCP_URL = "https://notion-mcp-official.node2flow.net"
LINE_OFFICIAL_MCP_URL = "https://line-mcp-official.node2flow.net"
PLAYWRIGHT_MCP_URL = "https://playwright-mcp.node2flow.net"
GOOGLE_WORKSPACE_MCP_URL = "https://google-workspace-mcp.node2flow.net"
DASHBOARD_URL = "https://app.node2flow.net"

# Secrets (set via wrangler secret put)
# JWT_SECRET, ENCRYPTION_KEY
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
# CL_N8N_MCP_AUTH_TOKEN, NOTION_OFFICIAL_MCP_AUTH_TOKEN, LINE_OFFICIAL_MCP_AUTH_TOKEN
# PLAYWRIGHT_MCP_AUTH_TOKEN, GOOGLE_WORKSPACE_MCP_AUTH_TOKEN
