name = "node2flow-platform"
main = "src/index.ts"
compatibility_date = "2025-01-13"

routes = [
  { pattern = "platform.node2flow.net", custom_domain = true }
]

# D1 Database - Platform data (users, plans, billing)
[[d1_databases]]
binding = "DB"
database_name = "node2flow-platform-db"
database_id = "9c73d346-da37-4152-9572-8499a969b8fb"
migrations_dir = "migrations"

# KV Namespace - Rate limiting (Node2Flow dedicated)
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "9a87f5a1d2a7413dba6f022976b7b874"

# OAuth State KV
[[kv_namespaces]]
binding = "OAUTH_STATE_KV"
id = "a65a07688d774d56bb915cf9e961881a"

# Cron triggers
[triggers]
crons = ["0 0 * * *"] # Daily at midnight UTC

# Environment variables (set via wrangler secret)
# JWT_SECRET, ENCRYPTION_KEY, STRIPE_SECRET_KEY, etc.
