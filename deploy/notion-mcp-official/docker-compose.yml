services:
  notion-mcp:
    image: node:20-alpine
    container_name: notion-mcp-official
    restart: unless-stopped
    ports:
      - "127.0.0.1:3008:3000"
    environment:
      - PORT=3000
      - AUTH_TOKEN=${AUTH_TOKEN}
    mem_limit: 512m
    mem_reservation: 256m
    volumes:
      - ../mcp-http-bridge.mjs:/app/mcp-http-bridge.mjs:ro
    working_dir: /app
    command: >
      sh -c "npm install -g @notionhq/notion-mcp-server &&
             node mcp-http-bridge.mjs npx notion-mcp-server"
