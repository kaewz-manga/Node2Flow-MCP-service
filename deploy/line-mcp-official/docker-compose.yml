services:
  line-mcp:
    image: node:20-alpine
    container_name: line-mcp-official
    restart: unless-stopped
    ports:
      - "127.0.0.1:3009:3000"
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=true
      - PORT=3000
      - AUTH_TOKEN=${AUTH_TOKEN}
    mem_limit: 512m
    mem_reservation: 256m
    volumes:
      - ../mcp-http-bridge.mjs:/app/mcp-http-bridge.mjs:ro
    working_dir: /app
    command: >
      sh -c "npm install -g @line/line-bot-mcp-server &&
             node mcp-http-bridge.mjs npx line-bot-mcp-server"
